syntax = "proto3";

package exchange.order.v1;

option go_package = "github.com/exchange-core-starter/exchange-core-starter/proto/order/v1;orderv1";

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
  ORDER_TYPE_STOP_LIMIT = 3;
  ORDER_TYPE_STOP_MARKET = 4;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_GTC = 1;
  TIME_IN_FORCE_IOC = 2;
  TIME_IN_FORCE_FOK = 3;
  TIME_IN_FORCE_GTX = 4;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_NEW = 1;
  ORDER_STATUS_ACCEPTED = 2;
  ORDER_STATUS_PARTIALLY_FILLED = 3;
  ORDER_STATUS_FILLED = 4;
  ORDER_STATUS_CANCELED = 5;
  ORDER_STATUS_REJECTED = 6;
  ORDER_STATUS_EXPIRED = 7;
}

message SubmitOrderRequest {
  string request_id = 1;
  int64 user_id = 2;
  int64 account_id = 3;
  string client_order_id = 4;
  string symbol = 5;
  Side side = 6;
  OrderType type = 7;
  TimeInForce time_in_force = 8;
  int64 price = 9;
  int64 quantity = 10;
  bool post_only = 11;
  bool reduce_only = 12;
}

message SubmitOrderResponse {
  int64 order_id = 1;
  string client_order_id = 2;
  OrderStatus status = 3;
}

message CancelOrderRequest {
  string request_id = 1;
  int64 user_id = 2;
  string symbol = 3;
  int64 order_id = 4;
}

message CancelOrderResponse {
  int64 order_id = 1;
  OrderStatus status = 2;
}

service OrderService {
  rpc SubmitOrder(SubmitOrderRequest) returns (SubmitOrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
}

