syntax = "proto3";

package exchange.account.v1;

option go_package = "github.com/exchange-core-starter/exchange-core-starter/proto/account/v1;accountv1";

message Balance {
  int64 account_id = 1;
  int64 user_id = 2;
  string account_type = 3;
  string asset = 4;
  int64 available = 5;
  int64 locked = 6;
  int64 version = 7;
}

message LedgerEntry {
  int64 entry_id = 1;
  int64 transaction_id = 2;
  int64 account_id = 3;
  string asset = 4;
  int64 debit = 5;
  int64 credit = 6;
  int64 balance_after = 7;
  string type = 8;
  string reference_type = 9;
  string reference_id = 10;
  int64 created_at_ms = 11;
}

message GetBalanceRequest {
  int64 user_id = 1;
  string account_type = 2;
  string asset = 3;
}

message GetBalanceResponse {
  Balance balance = 1;
}

message GetLedgerEntriesRequest {
  int64 account_id = 1;
  string asset = 2;
  int32 limit = 3;
}

message GetLedgerEntriesResponse {
  repeated LedgerEntry entries = 1;
}

service AccountService {
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  rpc GetLedgerEntries(GetLedgerEntriesRequest) returns (GetLedgerEntriesResponse);
}

