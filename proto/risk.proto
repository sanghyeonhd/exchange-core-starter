syntax = "proto3";

package exchange.risk.v1;

option go_package = "github.com/exchange-core-starter/exchange-core-starter/proto/risk/v1;riskv1";

message CheckOrderRiskRequest {
  int64 user_id = 1;
  string symbol = 2;
  string side = 3;
  int64 price = 4;
  int64 quantity = 5;
  bool reduce_only = 6;
  int64 mark_price = 7;
}

message CheckOrderRiskResponse {
  bool accepted = 1;
  string rejection_code = 2;
  string rejection_message = 3;
}

message LiquidationCandidate {
  int64 position_id = 1;
  int64 user_id = 2;
  string symbol = 3;
  int64 margin_ratio = 4;
  int64 maintenance_margin_ratio = 5;
}

message ListLiquidationCandidatesRequest {
  string symbol = 1;
  int32 limit = 2;
}

message ListLiquidationCandidatesResponse {
  repeated LiquidationCandidate candidates = 1;
}

service RiskService {
  rpc CheckOrderRisk(CheckOrderRiskRequest) returns (CheckOrderRiskResponse);
  rpc ListLiquidationCandidates(ListLiquidationCandidatesRequest) returns (ListLiquidationCandidatesResponse);
}

